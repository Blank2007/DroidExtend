name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  guards:
    name: 静态检查 / Static checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 语法检查（host + tools） / Syntax check (host + tools)
        run: python -m compileall -q host tools

      - name: 版本号一致性 / Version consistency
        shell: pwsh
        run: |
          $py = (Select-String -Path host/version.py -Pattern '^APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $iss = (Select-String -Path tools/installer/DroidExtend.iss -Pattern '#define AppVer\s+"([^"]+)"').Matches[0].Groups[1].Value
          $mf = (Select-String -Path android/AndroidManifest.xml -Pattern 'android:versionName="([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "host/version.py  APP_VERSION  = $py"
          Write-Host "installer        AppVer       = $iss"
          Write-Host "AndroidManifest  versionName  = $mf"
          if ($py -ne $iss) { throw "版本号不一致 (version mismatch)：host/version.py 是 $py，安装包是 $iss" }
          if ($py -ne $mf)  { throw "版本号不一致 (version mismatch)：host/version.py 是 $py，AndroidManifest 是 $mf" }

      - name: 禁止写死开发机路径 / No hard-coded dev machine paths
        shell: pwsh
        run: |
          # 抓的是 "别把我这台机器的目录写进代码" 这一类问题。 / Catches this class of problem: "don't bake this machine's directories into the code".
          # 只检查会被打包或会被别人跑的代码；tools/tmp 是丢弃型调试脚本，排除在外。 / Only checks code that gets packaged or that other people run; tools/tmp holds throwaway debug scripts and is excluded.
          $patterns = @('D:\dsh projects', 'D:\workbuddy', 'D:\DroidExtend', 'C:\Users\15530')
          $files = @()
          $files += Get-ChildItem host -Recurse -File -Include *.py
          $files += Get-ChildItem android -Recurse -File -Include *.py,*.java,*.xml
          $files += Get-ChildItem tools -Recurse -File -Include *.py,*.ps1,*.psm1,*.cs,*.json |
                    Where-Object { $_.FullName -notmatch '\\tmp\\' }
          $bad = 0
          foreach ($pat in $patterns) {
            $hits = Select-String -Path $files.FullName -Pattern $pat -SimpleMatch
            foreach ($h in $hits) {
              Write-Host "::error file=$($h.Path),line=$($h.LineNumber)::$($h.Line.Trim())"
              $bad++
            }
          }
          if ($bad -gt 0) {
            # English: hard-coded development-machine paths found, $bad occurrences in total.
            # Use $PSScriptRoot, derive the path from __file__, or read it from an environment variable.
            throw "发现写死的开发机路径，共 $bad 处。用 `$PSScriptRoot 或基于 __file__ 推导，或从环境变量读。"
          }
          Write-Host "没有写死的开发机路径 (no hard-coded development-machine paths found)。"

      - name: PowerShell 语法检查 / PowerShell syntax check
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem tools -Recurse -File -Include *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors)
            if ($errors) {
              $failed = $true
              $errors | ForEach-Object {
                Write-Host "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)"
              }
            }
          }
          if ($failed) { throw "PowerShell 脚本有语法错误 (PowerShell script has syntax errors)" }
          Write-Host "PowerShell 脚本语法正常 (PowerShell script syntax is OK)。"

  android:
    name: 安卓端能编译 / Android side compiles
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 下载 Android SDK 的两个包 / Download the two Android SDK packages
        shell: pwsh
        run: |
          # 不装 150 MB 的 cmdline-tools，也不用 sdkmanager：dl.google.com 直接提供 / No 150 MB cmdline-tools and no sdkmanager: dl.google.com serves
          # 这两个 zip，解压出来就是一个正常的 ANDROID_HOME 子目录，还省掉许可证交互。 / these two zips directly; unzipped they are ordinary ANDROID_HOME subdirectories, and the licence prompts are skipped too.
          # 这两个 URL 与 tools/provision2.py 里用的完全一致。 / These two URLs are identical to the ones used in tools/provision2.py.
          $sdk = Join-Path $env:RUNNER_TEMP 'android-sdk'
          $pkgs = @(
            @{ url = 'https://dl.google.com/android/repository/build-tools_r34-windows.zip'
               dest = Join-Path $sdk 'build-tools\34.0.0' },
            @{ url = 'https://dl.google.com/android/repository/platform-34-ext7_r03.zip'
               dest = Join-Path $sdk 'platforms\android-34' }
          )
          foreach ($p in $pkgs) {
            $zip = Join-Path $env:RUNNER_TEMP (Split-Path $p.url -Leaf)
            Write-Host "downloading $($p.url)"
            Invoke-WebRequest -Uri $p.url -OutFile $zip -UseBasicParsing
            $unz = Join-Path $env:RUNNER_TEMP 'unz'
            Remove-Item $unz -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive -Path $zip -DestinationPath $unz -Force
            $inner = @(Get-ChildItem $unz -Directory)[0]
            New-Item -ItemType Directory -Force -Path (Split-Path $p.dest) | Out-Null
            Move-Item $inner.FullName $p.dest
            Write-Host "  $($inner.Name) -> $($p.dest)"
          }
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 编译（aapt2 生成 R.java，再 javac 全部源码） / Compile (aapt2 generates R.java, then javac on every source file)
        shell: pwsh
        run: |
          # 这里刻意不跑 android/build.py：它会去拿仓库里没有的 tools/sdk， / android/build.py is deliberately not run here: it wants tools/sdk, which is not in the repo,
          # 以及一个不进仓库的 r8 jar。CI 要证明的只是 "源码能编译"， / plus an r8 jar that is not committed. All CI has to prove is that "the sources compile",
          # 所以只做 aapt2 + javac，d8 / 签名 / zipalign 留给发布流程。 / so only aapt2 + javac run here; d8 / signing / zipalign are left to the release flow.
          # 参数与 android/build.py 的 [1/7]~[3/7] 保持一致，特别是 / The flags match steps [1/7]~[3/7] of android/build.py, in particular
          # -bootclasspath：平台类必须来自 android.jar，不是 JDK 自带的。 / -bootclasspath: platform classes must come from android.jar, not from the JDK's own.
          $root = $PWD
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { $sdk = $env:ANDROID_SDK_ROOT }
          $bt  = Join-Path $sdk 'build-tools\34.0.0'
          $jar = Join-Path $sdk 'platforms\android-34\android.jar'
          $work = Join-Path $root 'android\build'
          $gen = Join-Path $work 'ci_gen'
          $cls = Join-Path $work 'ci_classes'
          $res = Join-Path $work 'ci_res.zip'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $gen, $cls | Out-Null

          & (Join-Path $bt 'aapt2.exe') compile --dir (Join-Path $root 'android\res') -o $res
          if ($LASTEXITCODE -ne 0) { throw "aapt2 compile 失败 (aapt2 compile failed)" }

          & (Join-Path $bt 'aapt2.exe') link -o (Join-Path $work 'ci_base.apk') `
              -I $jar --manifest (Join-Path $root 'android\AndroidManifest.xml') `
              --min-sdk-version 21 --target-sdk-version 34 --java $gen --no-version-vectors $res
          if ($LASTEXITCODE -ne 0) { throw "aapt2 link 失败 (aapt2 link failed)" }

          $src = @(Get-ChildItem android/src -Recurse -File -Include *.java | ForEach-Object { $_.FullName })
          $rjava = @(Get-ChildItem $gen -Recurse -File -Include R.java | ForEach-Object { $_.FullName })
          # English: the line below reports the number of java source files, then the number of generated R.java files.
          Write-Host "java 源文件 $($src.Count) 个，生成的 R.java $($rjava.Count) 个"
          if ($src.Count -eq 0) { throw "android/src 下没有 java 文件 (no java files under android/src)" }
          if ($rjava.Count -eq 0) { throw "aapt2 没有生成 R.java (aapt2 did not generate R.java)" }

          & javac -encoding UTF-8 -nowarn -source 8 -target 8 -bootclasspath $jar `
              -d $cls @($src + $rjava)
          if ($LASTEXITCODE -ne 0) { throw "javac 编译失败 (javac compilation failed)" }
          $n = @(Get-ChildItem $cls -Recurse -File -Include *.class).Count
          # English: the line below reports that every java file on the Android side compiled, and how many .class files were produced.
          Write-Host "安卓端 $($src.Count) 个 java 文件全部编译通过，产出 $n 个 .class。"
