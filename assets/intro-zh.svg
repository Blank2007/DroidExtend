    <circle cx="328" cy="500" r="4" fill="#60A5FA"/>
    <text x="342" y="506" fill="#A9BEE0" font-size="14">触摸反控 · 拔线即摘屏</text>
  </g>

  <text x="72" y="574" fill="#5B7099" font-size="14">Python + FFmpeg 主机端 · 纯 Java 手机端 · MIT 开源 · 代码由 AI 编写</text>

