    <rect x="12" y="13" width="8" height="8" rx="2" fill="#34D399"/>
    <text x="30" y="23" fill="#8FD8BC" font-size="15" letter-spacing="0.5">ADB · USB 直连</text>
  </g>

  <text x="72" y="216" fill="#FFFFFF" font-size="66" font-weight="800" letter-spacing="-1">DroidExtend</text>

  <rect x="72" y="248" width="560" height="3" rx="1.5" fill="url(#accent)" opacity="0.85"/>

  <text x="72" y="304" fill="#D6E4FF" font-size="25" font-weight="600">用一根 USB 数据线，把安卓手机</text>
  <text x="72" y="340" fill="#D6E4FF" font-size="25" font-weight="600">变成 Windows 的第二块显示器</text>

  <text x="74" y="378" fill="#8FA9CF" font-size="17">真扩展桌面，不是投屏镜像 —— 窗口拖过去、鼠标直接点</text>

  <g>
    <rect x="72" y="424" width="188" height="40" rx="20" fill="#0E2138" stroke="#256E5C" stroke-width="1"/>
    <text x="90" y="450" fill="#5EEAD4" font-size="19" font-weight="700">5–11 ms</text>
    <text x="182" y="450" fill="#7FB8AE" font-size="13">端到端延迟</text>

    <rect x="272" y="424" width="192" height="40" rx="20" fill="#0E2138" stroke="#256E5C" stroke-width="1"/>
    <text x="290" y="450" fill="#5EEAD4" font-size="19" font-weight="700">0</text>
    <text x="306" y="450" fill="#7FB8AE" font-size="13">装第三方 App</text>

    <rect x="476" y="424" width="184" height="40" rx="20" fill="#0E2138" stroke="#256E5C" stroke-width="1"/>
    <text x="494" y="450" fill="#5EEAD4" font-size="19" font-weight="700">1080p60</text>
    <text x="576" y="450" fill="#7FB8AE" font-size="13">画质可调</text>
  </g>

